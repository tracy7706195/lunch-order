<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFF 獨立測試頁面</title>
    <!-- 引入 LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 30px; text-align: center; }
        .card { background: #222; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .status { font-size: 16px; color: #4ade80; margin-top: 15px; word-break: break-all; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🧪 LIFF 認證診斷測試</h2>
        <p class="status" id="testStatus">正在準備初始化...</p>
    </div>

    <script>
        // 您的真實 LIFF ID
        const LIFF_ID = "2012191744-V9c1IIFW";

        window.addEventListener('load', async function() {
            let statusEl = document.getElementById('testStatus');

            try {
                // 1. 檢查 SDK 是否載入
                if (typeof liff === 'undefined') {
                    throw new Error("【失敗】window.liff 物件不存在，SDK 未成功載入。");
                }
                statusEl.innerText = "1. SDK 載入成功，正在執行 liff.init()...";

                // 2. 初始化 LIFF
                await liff.init({ liffId: LIFF_ID });
                statusEl.innerText = "2. liff.init() 成功！檢查登入狀態...";

                // 3. 檢查環境與登入
                if (liff.isInClient()) {
                    statusEl.innerText = "3. 偵測到在 LINE App 內，檢查是否登入...";
                    if (!liff.isLoggedIn()) {
                        statusEl.innerText = "4. 尚未登入，準備導向 LINE 登入頁面...";
                        liff.login();
                        return;
                    }

                    // 4. 取得 Profile
                    statusEl.innerText = "4. 正在取得使用者 Profile...";
                    let profile = await liff.getProfile();
                    
                    statusEl.innerHTML = `🎉 <strong>認證完全成功！</strong><br>LINE 顯示名稱：${profile.displayName}<br>User ID：${profile.userId}`;
                } else {
                    statusEl.innerText = "⚠️ 目前是在電腦或一般外部瀏覽器開啟，無法直接抓取 LINE 身分（屬於正常現象）。";
                }

            } catch (err) {
                console.error("LIFF 測試失敗:", err);
                statusEl.className = "status error";
                statusEl.innerHTML = `❌ 初始化失敗<br>${err.message || JSON.stringify(err)}`;
                
                // 強制彈窗讓手機立刻看到錯誤原因
                alert("LIFF 測試失敗原因: " + (err.message || JSON.stringify(err)));
            }
        });
    </script>
</body>
</html>
