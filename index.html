<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店小二點餐系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen pb-20">

    <header class="bg-emerald-600 p-4 text-center shadow-md">
        <h1 class="text-xl font-bold">🍱 店小二點餐系統</h1>
        <p id="userWelcome" class="text-xs text-emerald-100 mt-1">目前登入：LIFF 驗證中...</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 shadow-sm space-y-3">
            <div class="text-sm font-bold text-gray-300 text-center" id="displayTargetDate">載入中...</div>
        </div>
    </main>

    <script>
        // 設定您的真實 LIFF ID
        const LIFF_ID = "2012191744-V9c1IIFW";
        let currentUser = { name: "訪客模式", id: "" };

        window.onload = async function() {
            await initializeLiff();
        };

        async function initializeLiff() {
            try {
                if (typeof liff === 'undefined') {
                    throw new Error("【錯誤】window.liff 物件不存在，SDK 未成功載入。");
                }

                // 執行初始化
                await liff.init({ liffId: LIFF_ID });
                
                if (liff.isInClient()) {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                        return;
                    }
                    // 抓取 LINE 使用者身分
                    let profile = await liff.getProfile();
                    currentUser.name = profile.displayName;
                    currentUser.id = profile.userId;
                    document.getElementById("userWelcome").innerText = `目前登入：${currentUser.name} (LINE 認證成功)`;
                } else {
                    document.getElementById("userWelcome").innerText = `目前登入：外部瀏覽器環境`;
                }
            } catch (err) {
                console.error("LIFF 初始化錯誤:", err);
                // 🔴 當發生任何異常時，強制彈窗顯示真正的失敗原因
                alert("LIFF 認證失敗原因: " + (err.message || JSON.stringify(err)));
                document.getElementById("userWelcome").innerText = `目前登入：訪客模式 (發生錯誤)`;
            }
        }
    </script>
</body>
</html>
