<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店小二點餐系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 🟢 雙保險：主 CDN 失敗時自動切換備用 CDN -->
    <script src="https://static.line-scdn.net/sdk/v2/liff.js"></script>
    <script>
        if (typeof liff === 'undefined') {
            document.write('<script src="https://unpkg.com/@line/liff@2/dist/lib/index.js"><\/script>');
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-gray-800 rounded-xl shadow-lg p-6 space-y-6">
        
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-green-400">🍱 店小二跨日點餐系統</h1>
            <p id="lineUser" class="text-sm text-green-300 font-bold">正在進行 LINE 認證...</p>
        </div>

        <div class="bg-gray-700/50 p-4 rounded-lg space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-gray-300">目標日期：</span>
                <input type="date" id="targetDate" class="bg-gray-700 text-white px-3 py-1 rounded border border-gray-600 text-sm">
            </div>
            
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-gray-300">選擇店家：</span>
                <select id="storeSelect" class="bg-gray-700 text-white px-3 py-1.5 rounded border border-gray-600 text-sm w-48">
                    <option value="">等待認證後載入...</option>
                </select>
            </div>
        </div>

        <div class="space-y-3">
            <h2 class="text-sm font-bold text-gray-300 uppercase tracking-wider">菜單列表：</h2>
            <div id="menuList" class="space-y-2">
                <div class="text-center text-gray-400 py-4">請先完成認證...</div>
            </div>
        </div>
    </div>

    <script>
        const LIFF_ID = "2012191744-V9c1IIFW";

        window.onload = async function() {
            let today = new Date().toISOString().split('T')[0];
            document.getElementById('targetDate').value = today;

            try {
                // 再次確認雙 CDN 載入結果
                if (typeof liff === 'undefined') {
                    throw new Error("主備用 CDN 皆無法載入 liff.js，請檢查網路連線或切換行動網路測試。");
                }

                // 初始化 LIFF
                await liff.init({ liffId: LIFF_ID });
                
                if (liff.isInClient()) {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                        return;
                    }
                    let profile = await liff.getProfile();
                    document.getElementById('lineUser').innerText = `目前登入：${profile.displayName}`;
                } else {
                    document.getElementById('lineUser').innerText = `目前登入：測試同仁 (非 LINE 環境)`;
                }
            } catch (error) {
                console.error("LIFF Init Error:", error);
                alert("LIFF 認證失敗詳情:\n" + (error.message || JSON.stringify(error)));
                document.getElementById('lineUser').innerText = `目前登入：訪客模式 (認證失敗)`;
            }
        };
    </script>
</body>
</html>
