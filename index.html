<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFF 認證測試</title>
    <!-- 引入 LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/sdk/v2/liff.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: #fff; text-align: center; }
        .box { background: #2a2a2a; padding: 20px; border-radius: 10px; margin-top: 20px; }
        .status { font-size: 18px; color: #4ade80; font-weight: bold; }
        .error { color: #f87171; word-break: break-all; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>🧪 店小二 LIFF 身分認證測試</h2>
    <div class="box">
        <p>目前狀態：</p>
        <p id="userStatus" class="status">正在進行 LIFF 初始化...</p>
        <p id="errorLog" class="error"></p>
    </div>

    <script>
        const LIFF_ID = "2012191744-V9c1IIFW";

        window.onload = async function() {
            try {
                // 1. 初始化 LIFF
                await liff.init({ liffId: LIFF_ID });
                
                // 2. 判斷是否在 LINE App 內
                if (liff.isInClient()) {
                    if (!liff.isLoggedIn()) {
                        document.getElementById('userStatus').innerText = "未登入，準備前往 LINE 授權頁面...";
                        liff.login();
                        return;
                    }
                    
                    // 3. 抓取 LINE 身分
                    let profile = await liff.getProfile();
                    document.getElementById('userStatus').innerText = "🎉 認證成功！名字：" + profile.displayName;
                } else {
                    document.getElementById('userStatus').innerText = "⚠️ 目前在電腦/一般瀏覽器開啟，請使用手機 LINE 點擊 LIFF 連結測試！";
                }
            } catch (err) {
                console.error("LIFF Error:", err);
                document.getElementById('userStatus').innerText = "❌ LIFF 認證失敗！";
                // 顯示精準的錯誤代碼與訊息
                document.getElementById('errorLog').innerText = "詳細錯誤：\n" + (err.message || JSON.stringify(err));
            }
        };
    </script>
</body>
</html>
