<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7f4"><title>店小二點餐</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--green:#18794e;--dark:#173b2d;--bg:#f4f7f4;--card:#fff;--line:#e2e9e3;--muted:#65756b;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1d2922;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px}.app{max-width:620px;margin:auto;padding:16px 14px 112px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}.brand{font-size:22px;font-weight:900;color:var(--dark)}.who{font-size:13px;color:var(--muted)}.panel,.store-card,.item,.person-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #183d2910}.title{font-size:21px;font-weight:850;margin:10px 0}.muted{color:var(--muted);font-size:13px}.store-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.store-name{font-size:19px;font-weight:850}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--green);color:white;font-weight:800;font-size:16px;cursor:pointer}.btn.secondary{background:#e8f1eb;color:var(--dark)}.btn.danger{background:#b42318}.btn:disabled{opacity:.5}.btn.small{padding:9px 12px;font-size:14px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #cbd5ce;border-radius:10px;font-size:16px;background:#fff}.hidden{display:none!important}.tabs{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:800;font-size:16px;color:var(--dark)}.tabs button.active{background:var(--dark);color:#fff}.cat-tabs{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding:8px 0;scrollbar-width:thin}.cat-tabs button{flex:0 0 auto;border:1px solid #cbd8ce;border-radius:22px;padding:9px 14px;background:#fff;color:var(--dark);font-weight:750}.cat-tabs button.active{background:var(--green);border-color:var(--green);color:#fff}.menu-list{display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;padding:13px}.item-main{min-width:0}.item-name{font-size:17px;font-weight:800;overflow-wrap:anywhere}.item-price{color:var(--green);font-size:14px;margin-top:4px}.qty-control{display:flex;align-items:center;gap:10px;flex-shrink:0}.qty-control button{width:36px;height:36px;border:0;border-radius:50%;background:#e6f2e9;color:var(--dark);font-size:23px;font-weight:800}.qty-control span{min-width:20px;text-align:center;font-weight:850;font-size:17px}.sticky-bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:10}.sticky-inner{max-width:590px;margin:auto}.total-line{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#edf5ef;border-radius:12px;padding:12px 8px;text-align:center}.stat strong{display:block;font-size:22px;color:var(--dark)}.stat span{font-size:12px;color:var(--muted)}.summary-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.person-card h3{margin:0 0 9px;font-size:18px}.detail-line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:15px}.detail-line span:first-child{min-width:0;overflow-wrap:anywhere}.person-total{border-top:1px solid var(--line);padding-top:9px;margin-top:7px;display:flex;justify-content:space-between;font-weight:900}.preview-menu{max-height:45vh;overflow:auto}.note{width:100%;padding:11px;border:1px solid #cbd5ce;border-radius:10px;font-size:15px}.msg{padding:18px;text-align:center;color:var(--muted)}.badge{font-size:12px;color:#17633f;background:#e6f4e9;padding:4px 8px;border-radius:20px;font-weight:800}.owner-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.owner-tools .btn{flex:1}.footer-space{height:8px}.modal-backdrop{position:fixed;inset:0;background:#0f172acc;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:100%;max-width:600px;max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.edit-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.edit-row .qty-control button{width:34px;height:34px}
</style></head>
<body><main class="app">
<header class="top"><div class="brand">🍱 店小二點餐</div><div class="who" id="userStatus">正在登入 LINE…</div></header>
<section id="homeView">
  <div class="title">選擇店家</div><div class="muted">先看看菜單，決定好再開團。</div>
  <div id="storeList" class="msg">店家載入中…</div>
  <section id="storePreview" class="panel hidden">
    <div class="row"><div><div class="title" id="previewStoreName"></div><div class="muted">菜單預覽</div></div><button class="btn secondary small" id="closePreview">關閉</button></div>
    <div id="previewMenu" class="preview-menu"></div>
    <div class="field"><label for="groupDate">用餐日期</label><input type="date" id="groupDate"></div>
    <div class="field"><label for="groupCutoff">點餐截止時間</label><input type="datetime-local" id="groupCutoff"></div>
    <button class="btn" id="createGroup" style="width:100%">我要開團</button>
    <div class="muted" style="margin-top:8px">按下後會建立團訂，並自動把專屬小卡片發到 LINE 群組。</div>
  </section>
  <div class="title" style="margin-top:24px">目前開放中的團訂</div><div id="openGroups" class="msg">載入中…</div>
</section>
<section id="groupView" class="hidden">
  <div class="row"><div><div class="title" id="groupTitle">團訂</div><div class="muted" id="groupMeta"></div></div><span class="badge" id="groupStatus">開放點餐</span></div>
  <div class="tabs"><button id="tabMenu" class="active">點餐</button><button id="tabCart">購物車</button></div>
  <section id="menuPage">
    <div id="categoryTabs" class="cat-tabs"></div><div id="menuItems" class="menu-list"></div>
    <div class="field"><label for="myNote">我的備註（選填）</label><input id="myNote" class="note" placeholder="例如：不要辣、少冰"></div>
  </section>
  <section id="cartPage" class="hidden">
    <div class="stats"><div class="stat"><strong id="statPeople">0</strong><span>總人數</span></div><div class="stat"><strong id="statQty">0</strong><span>總品項</span></div><div class="stat"><strong id="statAmount">$0</strong><span>總金額</span></div></div>
    <div class="panel"><div class="title">各品項統計</div><div id="itemSummary"></div></div>
    <div class="title">訂餐明細</div><div id="memberDetails"></div>
  </section>
  <div class="footer-space"></div>
</section>
</main>
<div id="menuFooter" class="sticky-bottom hidden"><div class="sticky-inner"><div class="total-line"><span>我的訂單</span><span id="myTotal">$0</span></div><button id="submitOrder" class="btn" style="width:100%">送出訂單</button></div></div>
<div id="cartFooter" class="sticky-bottom hidden"><div class="sticky-inner"><button id="backToMenu" class="btn secondary" style="width:100%">返回點餐</button></div></div>
<div id="ownerEditModal" class="modal-backdrop hidden"><div class="modal"><div class="modal-head"><div><div class="title" id="editModalTitle">修改團員訂單</div><div class="muted">調整數量後儲存</div></div><button class="btn secondary small" id="cancelEditModal">關閉</button></div><div id="ownerEditItems"></div><div class="field"><label for="ownerEditNote">訂單備註</label><input id="ownerEditNote" class="note" placeholder="選填"></div><button id="saveOwnerEdit" class="btn" style="width:100%">儲存修改</button></div></div>
<script>
'use strict';
const LIFF_ID='2012191744-V9c1IIFW';
const GAS_API_URL='https://script.google.com/macros/s/AKfycbxQcZewSGx0jWMK75CGCElJUY3QCeBA-VWbWpZhgc1ek0e_0ub5KSGKplltVaSuEWhTyQ/exec';
const $=id=>document.getElementById(id);let me={id:'',name:'訪客',token:''},stores=[],selectedStore=null,previewMenu=[],groupId='',group=null,menu=[],qty={},activeCategory='全部',myNote='',editingUser=null,ownerEditQty={};
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function defaultCutoff(){const d=new Date(Date.now()+2*3600000);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function money(n){return Number(n||0).toLocaleString('zh-TW')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function init(){ $('groupDate').value=today();$('groupCutoff').value=defaultCutoff();bind();await initLiff();await loadStores();const id=new URLSearchParams(location.search).get('groupOrderId');if(id)await openGroup(id);}
function bind(){ $('closePreview').onclick=()=>$('storePreview').classList.add('hidden');$('createGroup').onclick=createGroup;$('tabMenu').onclick=()=>switchPage('menu');$('tabCart').onclick=()=>switchPage('cart');$('submitOrder').onclick=submitOrder;$('backToMenu').onclick=()=>switchPage('menu');$('cancelEditModal').onclick=closeOwnerEdit;$('saveOwnerEdit').onclick=saveOwnerEdit; }
async function initLiff(){try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}const p=await liff.getProfile();me={id:p.userId,name:p.displayName||'LINE使用者',token:liff.getAccessToken()||''};$('userStatus').textContent='LINE：'+me.name;}catch(e){$('userStatus').textContent='LINE 登入失敗';console.error(e)}}
async function apiGet(p){const u=new URL(GAS_API_URL);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u);const j=await r.json();if(j.status!=='success')throw new Error(j.message||'讀取失敗');return j}
async function apiPost(action,extra={}){if(!me.token||!me.id)throw new Error('請從 LINE 內開啟並完成登入。');const r=await fetch(GAS_API_URL,{method:'POST',body:JSON.stringify({action,accessToken:me.token,userId:me.id,...extra})});const j=await r.json();if(j.status!=='success')throw new Error(j.message||'操作失敗');return j}
async function loadStores(){try{const r=await apiGet({action:'getStores'});stores=r.data||[];$('storeList').innerHTML=stores.length?stores.map(s=>`<div class="store-card"><div class="store-head"><div class="store-name">${esc(s.storeName)}</div><button class="btn small" data-preview="${esc(s.storeId)}">查看菜單／開團</button></div></div>`).join(''):'目前沒有店家資料。';document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>showPreview(b.dataset.preview));await loadOpenGroups();}catch(e){$('storeList').textContent='店家載入失敗：'+e.message}}
async function showPreview(id){try{selectedStore=stores.find(s=>s.storeId===id);if(!selectedStore)return;const r=await apiGet({action:'getMenu',storeId:id});previewMenu=r.data||[];$('previewStoreName').textContent=selectedStore.storeName;$('previewMenu').innerHTML=previewMenu.length?previewMenu.map(m=>`<div class="summary-line"><span>${esc(m.category)}｜${esc(m.itemName)}</span><b>$${money(m.unitPrice)}</b></div>`).join(''):'目前沒有菜單';$('groupDate').value=today();$('groupCutoff').value=defaultCutoff();$('storePreview').classList.remove('hidden');$('storePreview').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){alert(e.message)}}
async function createGroup(){try{const date=$('groupDate').value,cutoff=$('groupCutoff').value;if(!date||!cutoff)throw new Error('請填寫用餐日期及截止時間。');if(new Date(cutoff).getTime()<=Date.now())throw new Error('截止時間必須晚於現在。');$('createGroup').disabled=true;$('createGroup').textContent='建立並通知中…';const r=await apiPost('createGroupOrder',{targetDate:date,storeId:selectedStore.storeId,cutoffAt:cutoff});history.replaceState(null,'',location.pathname+'?groupOrderId='+encodeURIComponent(r.groupOrderId));await openGroup(r.groupOrderId);alert(r.notificationStatus==='sent'?'開團成功！LINE 群組已收到團訂卡片。':'團訂已建立，但 LINE 卡片沒有成功送出。請先檢查 LINE Worker 設定。');}catch(e){alert(e.message)}finally{$('createGroup').disabled=false;$('createGroup').textContent='我要開團'}}
async function loadOpenGroups(){try{const r=await apiPost('groupList');const list=r.data||[];$('openGroups').innerHTML=list.length?list.map(o=>`<div class="store-card"><div class="store-head"><div><div class="store-name">${esc(o.storeName)}</div><div class="muted">${esc(o.targetDate)}｜${esc(o.groupOrderId)}｜開團：${esc(o.ownerName)}</div></div><button class="btn secondary small" data-open="${esc(o.groupOrderId)}">查看</button></div></div>`).join(''):'目前沒有開放中的團訂';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openGroup(b.dataset.open));}catch(e){$('openGroups').textContent='團訂清單讀取失敗：'+e.message}}
async function openGroup(id){try{groupId=id;const r=await apiPost('groupDetail',{groupOrderId:id});group=r;menu=await apiGet({action:'getMenu',storeId:r.order.storeId}).then(x=>x.data||[]);qty={};const mine=(r.items||[]).filter(x=>x.userId===me.id);mine.forEach(x=>qty[x.itemName]=(qty[x.itemName]||0)+x.quantity);myNote=mine.map(x=>x.note).find(Boolean)||'';$('myNote').value=myNote;$('homeView').classList.add('hidden');$('groupView').classList.remove('hidden');$('groupTitle').textContent=r.order.storeName;$('groupMeta').textContent=`${r.order.groupOrderId}｜用餐 ${r.order.targetDate}｜開團者 ${r.order.ownerName}｜截止 ${String(r.order.cutoffAt).replace('T',' ')}`;$('groupStatus').textContent=r.order.status==='開放'?'開放點餐':'已結單';$('myNote').disabled=!canOrder();renderMenu();renderCart();switchPage(r.order.isOwner?'cart':'menu');}catch(e){alert('無法開啟團訂：'+e.message);history.replaceState(null,'',location.pathname);$('homeView').classList.remove('hidden');$('groupView').classList.add('hidden')}}
function canOrder(){return group&&group.order.status==='開放'&&(!group.order.cutoffAt||new Date(group.order.cutoffAt).getTime()>=Date.now())}
function switchPage(p){const menuOn=p==='menu';$('menuPage').classList.toggle('hidden',!menuOn);$('cartPage').classList.toggle('hidden',menuOn);$('tabMenu').classList.toggle('active',menuOn);$('tabCart').classList.toggle('active',!menuOn);$('menuFooter').classList.toggle('hidden',!menuOn||!canOrder());$('cartFooter').classList.toggle('hidden',menuOn);}
function renderMenu(){const cats=['全部',...new Set(menu.map(x=>x.category||'其他'))];if(!cats.includes(activeCategory))activeCategory='全部';$('categoryTabs').innerHTML=cats.map(c=>`<button class="${c===activeCategory?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderMenu()});const list=menu.filter(x=>activeCategory==='全部'||(x.category||'其他')===activeCategory);$('menuItems').innerHTML=list.length?list.map(it=>`<div class="item"><div class="item-main"><div class="item-name">${esc(it.itemName)}</div><div class="item-price">$${money(it.unitPrice)}</div></div><div class="qty-control"><button data-minus="${esc(it.itemName)}">−</button><span>${qty[it.itemName]||0}</span><button data-plus="${esc(it.itemName)}">＋</button></div></div>`).join(''):'此分類目前沒有餐點';document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.minus,-1));document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.plus,1));$('myTotal').textContent='$'+money(menu.reduce((s,x)=>s+(qty[x.itemName]||0)*x.unitPrice,0));}
function changeQty(name,delta){qty[name]=Math.max(0,(qty[name]||0)+delta);renderMenu()}
async function submitOrder(){try{const items=menu.filter(x=>(qty[x.itemName]||0)>0).map(x=>({itemName:x.itemName,quantity:qty[x.itemName],note:$('myNote').value}));if(!items.length)throw new Error('請至少選擇一項餐點。');$('submitOrder').disabled=true;await apiPost('groupSubmit',{groupOrderId:groupId,items});alert('訂單已送出！');await openGroup(groupId);switchPage('cart');}catch(e){alert(e.message)}finally{$('submitOrder').disabled=false}}
function renderCart(){if(!group)return;const items=group.items||[];$('statPeople').textContent=group.totalPeople||0;$('statQty').textContent=group.totalQty||0;$('statAmount').textContent='$'+money(group.totalAmount||0);const entries=Object.entries(group.summary||{});$('itemSummary').innerHTML=entries.length?entries.map(([name,v])=>`<div class="summary-line"><span>${esc(name)} × ${v.totalQty}</span><b>$${money(v.totalAmount)}</b></div>`).join(''):'尚無人點餐';const people=group.people||[];$('memberDetails').innerHTML=people.length?people.map(p=>`<div class="person-card"><h3>${esc(p.lineName)}</h3><div id="person-${safeId(p.userId)}">${p.items.map(it=>`<div class="detail-line"><span>${esc(it.itemName)} × ${it.quantity}</span><b>$${money(it.subtotal)}</b></div>`).join('')}</div><div class="person-total"><span>應付金額</span><span>$${money(p.total)}</span></div>${group.order.isOwner&&canOrder()?`<div class="owner-tools"><button class="btn secondary small" data-edit-user="${esc(p.userId)}">修改此人訂單</button><button class="btn danger small" data-cancel-user="${esc(p.userId)}">取消此人訂單</button></div>`:''}</div>`).join(''):'<div class="msg">尚無人點餐</div>';document.querySelectorAll('[data-edit-user]').forEach(b=>b.onclick=()=>ownerEdit(b.dataset.editUser));document.querySelectorAll('[data-cancel-user]').forEach(b=>b.onclick=()=>ownerCancel(b.dataset.cancelUser));}
function safeId(s){return 'u'+Array.from(String(s)).map(c=>c.charCodeAt(0).toString(16)).join('')}
function ownerEdit(userId){const p=(group.people||[]).find(x=>x.userId===userId);if(!p)return;editingUser=p;ownerEditQty={};p.items.forEach(x=>ownerEditQty[x.itemName]=(ownerEditQty[x.itemName]||0)+x.quantity);$('editModalTitle').textContent='修改 '+p.lineName+' 的訂單';$('ownerEditNote').value=p.items.map(x=>x.note).find(Boolean)||'';renderOwnerEditItems();$('ownerEditModal').classList.remove('hidden');}
function renderOwnerEditItems(){$('ownerEditItems').innerHTML=menu.map(it=>`<div class="edit-row"><div><div class="item-name">${esc(it.itemName)}</div><div class="item-price">$${money(it.unitPrice)}</div></div><div class="qty-control"><button data-edit-minus="${esc(it.itemName)}">−</button><span>${ownerEditQty[it.itemName]||0}</span><button data-edit-plus="${esc(it.itemName)}">＋</button></div></div>`).join('');document.querySelectorAll('[data-edit-minus]').forEach(b=>b.onclick=()=>{ownerEditQty[b.dataset.editMinus]=Math.max(0,(ownerEditQty[b.dataset.editMinus]||0)-1);renderOwnerEditItems()});document.querySelectorAll('[data-edit-plus]').forEach(b=>b.onclick=()=>{ownerEditQty[b.dataset.editPlus]=(ownerEditQty[b.dataset.editPlus]||0)+1;renderOwnerEditItems()});}
function closeOwnerEdit(){$('ownerEditModal').classList.add('hidden');editingUser=null;ownerEditQty={};}
async function saveOwnerEdit(){if(!editingUser)return;const items=menu.filter(x=>(ownerEditQty[x.itemName]||0)>0).map(x=>({itemName:x.itemName,quantity:ownerEditQty[x.itemName],note:$('ownerEditNote').value}));if(!items.length){alert('如要清空整筆訂單，請使用「取消此人訂單」。');return;}try{$('saveOwnerEdit').disabled=true;await apiPost('groupOwnerReplaceUser',{groupOrderId:groupId,targetUserId:editingUser.userId,targetName:editingUser.lineName,items});closeOwnerEdit();await openGroup(groupId);switchPage('cart');}catch(e){alert('修改失敗：'+e.message)}finally{$('saveOwnerEdit').disabled=false}}
async function ownerCancel(userId){const p=(group.people||[]).find(x=>x.userId===userId);if(!p||!confirm('確定取消 '+p.lineName+' 的全部訂單？'))return;try{await apiPost('groupOwnerCancelUser',{groupOrderId:groupId,targetUserId:userId});await openGroup(groupId);switchPage('cart')}catch(e){alert(e.message)}}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
