<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>店小二點餐系統</title>

  <!-- LINE LIFF SDK -->
  <script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 18px 14px 110px;
      background: #111827; color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap {
      width: 100%; max-width: 520px; margin: 0 auto;
      padding: 22px; background: #1f2937; border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.22);
    }
    h1 { margin: 0; color: #4ade80; font-size: 25px; text-align: center; }
    .status { margin: 10px 0 20px; text-align: center; color: #86efac; font-size: 14px; }
    .status.error { color: #fca5a5; }
    .panel { padding: 14px; margin-bottom: 20px; background: #374151; border-radius: 12px; }
    .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 9px 0; }
    label { color: #d1d5db; font-size: 14px; }
    input, select {
      min-width: 0; padding: 9px 10px; color: white;
      background: #1f2937; border: 1px solid #6b7280; border-radius: 8px;
      font-size: 15px;
    }
    #storeSelect { width: 62%; }
    h2 { margin: 0 0 12px; color: #d1d5db; font-size: 15px; }
    .menu-item {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin: 9px 0; padding: 13px;
      background: #374151; border: 1px solid #4b5563; border-radius: 10px;
    }
    .item-name { font-weight: 700; overflow-wrap: anywhere; }
    .price { margin-top: 5px; color: #4ade80; font-size: 14px; }
    .qty { width: 76px; text-align: center; }
    .message { padding: 18px 8px; color: #9ca3af; text-align: center; }
    .bottom {
      position: fixed; z-index: 5; right: 0; bottom: 0; left: 0;
      padding: 13px 16px calc(13px + env(safe-area-inset-bottom));
      background: rgba(17,24,39,.96); border-top: 1px solid #374151;
    }
    .bottom-inner { max-width: 520px; margin: auto; }
    button {
      width: 100%; padding: 15px; color: #052e16; background: #4ade80;
      border: 0; border-radius: 12px; font-size: 17px; font-weight: 800;
    }
    button:disabled { opacity: .55; }
    .total { margin: 0 0 9px; text-align: right; color: #d1d5db; font-size: 14px; }
  </style>
</head>

<body>
  <main class="wrap">
    <h1>🍱 店小二點餐系統</h1>
    <p id="lineUser" class="status">正在確認 LINE 登入狀態...</p>

    <section class="panel">
      <div class="field">
        <label for="targetDate">目標日期：</label>
        <input type="date" id="targetDate">
      </div>
      <div class="field">
        <label for="storeSelect">選擇店家：</label>
        <select id="storeSelect" disabled>
          <option value="">店家載入中...</option>
        </select>
      </div>
    </section>

    <section>
      <h2>菜單列表</h2>
      <div id="menuList" class="message">正在載入菜單...</div>
    </section>
  </main>

  <footer class="bottom">
    <div class="bottom-inner">
      <p id="orderTotal" class="total">目前合計：$0</p>
      <button id="submitButton" type="button">確認送出訂單</button>
    </div>
  </footer>

  <script>
    "use strict";

    const LIFF_ID = "2012191744-V9c1IIFW";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxQcZewSGx0jWMK75CGCElJUY3QCeBA-VWbWpZhgc1ek0e_0ub5KSGKplltVaSuEWhTyQ/exec";

    let currentLineName = "訪客";
    let menuDataCache = [];

    const $ = id => document.getElementById(id);

    document.addEventListener("DOMContentLoaded", initApp);

    async function initApp() {
      $("targetDate").value = getLocalDateString();
      $("storeSelect").addEventListener("change", event => loadMenu(event.target.value));
      $("submitButton").addEventListener("click", submitOrder);

      // 店家與菜單載入不依賴 LIFF 成功與否
      const storesTask = loadStores();
      await initLiff();
      await storesTask;
    }

    function getLocalDateString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function setLineStatus(message, isError = false) {
      $("lineUser").textContent = message;
      $("lineUser").classList.toggle("error", isError);
    }

    async function initLiff() {
      try {
        if (typeof window.liff === "undefined") {
          throw new Error("LIFF SDK 沒有成功載入。請確認網路或 SDK CDN。");
        }

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isInClient()) {
          currentLineName = "瀏覽器訪客";
          setLineStatus("目前不是從 LINE 內開啟；無法讀取 LINE 名稱。", true);
          return;
        }

        if (!liff.isLoggedIn()) {
          setLineStatus("正在前往 LINE 登入...");
          liff.login({ redirectUri: window.location.href });
          return;
        }

        const profile = await liff.getProfile();
        currentLineName = profile.displayName || "LINE使用者";
        setLineStatus(`目前登入：${currentLineName}（LINE 認證成功）`);
      } catch (error) {
        console.error("LIFF 初始化失敗：", error);
        currentLineName = "訪客";
        setLineStatus(`LINE 認證未完成：${error.message || error}`, true);
      }
    }

    async function apiGet(params) {
      const url = new URL(GAS_API_URL);
      Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
      const response = await fetch(url.toString(), { method: "GET", redirect: "follow" });
      if (!response.ok) throw new Error(`伺服器回應 ${response.status}`);
      const result = await response.json();
      if (result.status !== "success") throw new Error(result.message || "讀取資料失敗");
      return result;
    }

    async function loadStores() {
      const select = $("storeSelect");
      select.disabled = true;
      select.innerHTML = '<option value="">店家載入中...</option>';

      try {
        const result = await apiGet({ action: "getStores" });
        const stores = Array.isArray(result.data) ? result.data : [];

        if (!stores.length) {
          select.innerHTML = '<option value="">目前沒有可用店家</option>';
          $("menuList").textContent = "目前沒有可用店家。";
          return;
        }

        select.innerHTML = stores.map(store =>
          `<option value="${escapeHtml(store.storeId)}">${escapeHtml(store.storeName)}</option>`
        ).join("");

        select.disabled = false;
        await loadMenu(select.value);
      } catch (error) {
        console.error("店家載入失敗：", error);
        select.innerHTML = '<option value="">店家載入失敗</option>';
        $("menuList").textContent = `店家載入失敗：${error.message}`;
      }
    }

    async function loadMenu(storeId) {
      if (!storeId) return;
      $("menuList").textContent = "菜單載入中...";
      $("submitButton").disabled = true;
      menuDataCache = [];

      try {
        const result = await apiGet({ action: "getMenu", storeId });
        menuDataCache = Array.isArray(result.data) ? result.data : [];

        if (!menuDataCache.length) {
          $("menuList").textContent = "此店家目前沒有菜單。";
          updateTotal();
          return;
        }

        $("menuList").innerHTML = menuDataCache.map((item, index) => `
          <div class="menu-item">
            <div>
              <div class="item-name">${escapeHtml(item.itemName)}</div>
              <div class="price">$${Number(item.unitPrice).toLocaleString("zh-TW")} 元</div>
            </div>
            <input class="qty" type="number" min="0" step="1" inputmode="numeric"
              value="0" data-index="${index}" aria-label="${escapeHtml(item.itemName)}數量">
          </div>
        `).join("");

        $("menuList").querySelectorAll(".qty").forEach(input => {
          input.addEventListener("input", updateTotal);
        });

        $("submitButton").disabled = false;
        updateTotal();
      } catch (error) {
        console.error("菜單載入失敗：", error);
        $("menuList").textContent = `菜單載入失敗：${error.message}`;
        updateTotal();
      }
    }

    function collectOrderItems() {
      return Array.from($("menuList").querySelectorAll(".qty"))
        .map(input => {
          const index = Number(input.dataset.index);
          const item = menuDataCache[index];
          const quantity = Math.floor(Number(input.value) || 0);
          return {
            itemName: item.itemName,
            unitPrice: Number(item.unitPrice),
            quantity: quantity
          };
        })
        .filter(item => item.quantity > 0);
    }

    function updateTotal() {
      const items = collectOrderItems();
      const total = items.reduce((sum, item) => sum + item.quantity * item.unitPrice, 0);
      $("orderTotal").textContent = `目前合計：$${total.toLocaleString("zh-TW")}`;
    }

    async function submitOrder() {
      const targetDate = $("targetDate").value;
      const storeSelect = $("storeSelect");
      const storeId = storeSelect.value;
      const storeName = storeSelect.selectedOptions[0]?.textContent || "";
      const items = collectOrderItems();

      if (!targetDate) return alert("請先選擇用餐日期。");
      if (!storeId) return alert("請先選擇店家。");
      if (!items.length) return alert("請至少選擇一項餐點。");

      const button = $("submitButton");
      button.disabled = true;
      button.textContent = "訂單送出中...";

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({
            targetDate,
            storeId,
            storeName,
            lineName: currentLineName,
            items
          })
        });

        if (!response.ok) throw new Error(`伺服器回應 ${response.status}`);
        const result = await response.json();
        if (result.status !== "success") throw new Error(result.message || "訂單寫入失敗");

        alert(`訂單送出成功！共記錄 ${result.savedCount || items.length} 項餐點。`);
        $("menuList").querySelectorAll(".qty").forEach(input => input.value = "0");
        updateTotal();
      } catch (error) {
        console.error("訂單送出失敗：", error);
        alert(`訂單送出失敗：${error.message}`);
      } finally {
        button.disabled = false;
        button.textContent = "確認送出訂單";
      }
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }
  </script>
</body>
</html>
